services:
  warehouse:
    image: pgvector/pgvector:pg16
    container_name: lifebase-warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifebase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifebase}
      POSTGRES_DB: ${POSTGRES_DB:-lifebase}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifebase} -d ${POSTGRES_DB:-lifebase}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
